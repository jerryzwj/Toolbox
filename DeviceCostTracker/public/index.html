<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>设备成本追踪</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a84ff'/%3E%3Ctext x='32' y='44' font-size='32' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3E¥%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0b0b0d;
    --card: #1c1c1f;
    --card-hover: #242428;
    --text: #f5f5f7;
    --text-secondary: #98989e;
    --text-tertiary: #636368;
    --green: #30d158;
    --gray: #8e8e93;
    --accent: #0a84ff;
    --red: #ff453a;
    --border: rgba(255,255,255,0.06);
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  body {
    max-width: 600px;
    margin: 0 auto;
    padding: 20px 16px 120px;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 24px;
    padding-top: env(safe-area-inset-top);
  }
  .header h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
  .header .sub { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
  .header .summary { text-align: right; font-size: 12px; color: var(--text-tertiary); line-height: 1.6; }
  .header .summary b { display: block; font-size: 20px; font-weight: 700; color: var(--text); }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 10px; }
  .stats-extra { grid-template-columns: repeat(2, 1fr); margin-bottom: 20px; }
  .stat { background: var(--card); border-radius: 14px; padding: 14px; }
  .stat .label { font-size: 11px; color: var(--text-secondary); margin-bottom: 6px; }
  .stat .value { font-size: 18px; font-weight: 700; }
  .stat .value small { font-size: 12px; font-weight: 400; color: var(--text-secondary); margin-left: 2px; }

  .device-list { display: flex; flex-direction: column; gap: 12px; }
  .device-card {
    background: var(--card);
    border-radius: 20px;
    padding: 18px;
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    transition: background 0.15s;
    border: 1px solid var(--border);
  }
  .device-card:active { background: var(--card-hover); }
  .device-icon {
    width: 48px; height: 48px;
    border-radius: 12px;
    background: rgba(255,255,255,0.06);
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; flex-shrink: 0;
  }
  .device-info { flex: 1; min-width: 0; }
  .device-name { font-size: 17px; font-weight: 600; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .device-meta { font-size: 12.5px; color: var(--text-secondary); margin-top: 2px; line-height: 1.45; }
  .device-meta .sell-price { color: var(--green); }
  .device-buy-date { font-size: 11px; color: var(--text-tertiary); margin-top: 2px; line-height: 1.45; }
  .device-right { text-align: right; flex-shrink: 0; }
  .device-days { font-size: 32px; font-weight: 700; letter-spacing: -1px; line-height: 1; }
  .device-days small { font-size: 14px; font-weight: 400; color: var(--text-secondary); margin-left: 2px; }
  .device-status { display: flex; align-items: center; justify-content: flex-end; gap: 5px; margin-top: 6px; font-size: 12px; color: var(--text-secondary); }
  .dot { width: 7px; height: 7px; border-radius: 50%; }
  .dot.active { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .dot.retired { background: var(--gray); }

  .empty { text-align: center; padding: 80px 20px; color: var(--text-tertiary); }
  .empty .icon { font-size: 48px; margin-bottom: 16px; opacity: 0.4; }
  .empty p { font-size: 15px; }

  .fab {
    position: fixed; bottom: 30px; right: 50%;
    transform: translateX(300px);
    width: 56px; height: 56px; border-radius: 50%;
    background: var(--accent); color: white; border: none;
    font-size: 28px; cursor: pointer;
    box-shadow: 0 8px 24px rgba(10,132,255,0.4);
    display: flex; align-items: center; justify-content: center;
    z-index: 100; transition: transform 0.15s;
  }
  .fab:active { transform: translateX(300px) scale(0.92); }
  @media (max-width: 600px) {
    .fab { right: 20px; transform: none; }
    .fab:active { transform: scale(0.92); }
  }

  .modal-mask {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6); backdrop-filter: blur(8px);
    z-index: 200; display: none;
    align-items: flex-end; justify-content: center;
  }
  .modal-mask.show { display: flex; }
  .modal {
    background: #1c1c1f; width: 100%; max-width: 600px;
    border-radius: 24px 24px 0 0;
    padding: 24px 20px calc(24px + env(safe-area-inset-bottom));
    max-height: 90vh; overflow-y: auto;
    animation: slideUp 0.25s ease;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal-handle { width: 36px; height: 4px; background: #3a3a3c; border-radius: 2px; margin: 0 auto 20px; }
  .modal h2 { font-size: 20px; font-weight: 700; margin-bottom: 20px; }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; }
  .form-group input, .form-group select {
    width: 100%; background: rgba(255,255,255,0.06);
    border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 14px; color: var(--text); font-size: 16px;
    outline: none; font-family: inherit;
  }
  .form-group input:focus { border-color: var(--accent); }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .icon-picker { display: flex; gap: 8px; flex-wrap: wrap; }
  .icon-option {
    width: 44px; height: 44px; border-radius: 10px;
    background: rgba(255,255,255,0.06); border: 2px solid transparent;
    font-size: 22px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .icon-option.selected { border-color: var(--accent); background: rgba(10,132,255,0.15); }

  .btn-row { display: flex; gap: 10px; margin-top: 20px; }
  .btn { flex: 1; padding: 14px; border-radius: 14px; border: none; font-size: 16px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .btn-primary { background: var(--accent); color: white; }
  .btn-secondary { background: rgba(255,255,255,0.1); color: var(--text); }
  .btn-danger { background: rgba(255,69,58,0.15); color: var(--red); }

  .toast {
    position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
    background: rgba(40,40,42,0.95); color: white;
    padding: 10px 20px; border-radius: 20px; font-size: 14px;
    z-index: 300; opacity: 0; transition: opacity 0.2s; pointer-events: none;
  }
  .toast.show { opacity: 1; }

  .section-label { font-size: 13px; color: var(--text-tertiary); margin: 20px 0 10px; }

  .loading { text-align: center; padding: 60px; color: var(--text-tertiary); font-size: 14px; }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>设备成本追踪</h1>
    <div class="sub">买入价 − 卖出价 ÷ 使用天数 = 每日成本</div>
  </div>
  <div class="summary">
    <b id="headerActiveCount">0</b>
    台使用中
  </div>
</div>

<div class="stats">
  <div class="stat"><div class="label">使用中</div><div class="value" id="statActive">0<small>台</small></div></div>
  <div class="stat"><div class="label">今日总成本</div><div class="value" id="statDailyCost">¥0</div></div>
  <div class="stat"><div class="label">累计退役</div><div class="value" id="statRetired">0<small>台</small></div></div>
</div>
<div class="stats stats-extra">
  <div class="stat"><div class="label">设备合计价格</div><div class="value" id="statTotalBuy">¥0</div></div>
  <div class="stat"><div class="label">售出合计价格</div><div class="value" id="statTotalSell">¥0</div></div>
</div>

<div id="loading" class="loading">加载中...</div>
<div class="device-list" id="deviceList" style="display:none"></div>

<div class="empty" id="emptyState" style="display:none">
  <div class="icon">📱</div>
  <p>还没有设备，点击右下角 + 添加</p>
</div>

<button class="fab" id="fabBtn">+</button>

<div class="modal-mask" id="editModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <h2 id="modalTitle">添加设备</h2>
    <div class="form-group">
      <label>设备名称</label>
      <input type="text" id="fName" placeholder="如 iPhone 18 Pro Max 1T">
    </div>
    <div class="form-group">
      <label>选择图标</label>
      <div class="icon-picker" id="iconPicker"></div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>买入价格 (¥)</label>
        <input type="number" id="fBuyPrice" placeholder="0.00" step="0.01" min="0">
      </div>
      <div class="form-group">
        <label>买入日期</label>
        <input type="date" id="fBuyDate">
      </div>
    </div>
    <div id="retireSection" style="display:none">
      <div class="section-label">退役信息</div>
      <div class="form-row">
        <div class="form-group">
          <label>退役日期</label>
          <input type="date" id="fRetireDate">
        </div>
        <div class="form-group">
          <label>卖出价格 (¥，可为0)</label>
          <input type="number" id="fSellPrice" placeholder="0" step="0.01" min="0" value="0">
        </div>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn btn-danger" id="btnDelete" style="display:none">删除</button>
      <button class="btn btn-secondary" id="btnCancel">取消</button>
      <button class="btn btn-primary" id="btnSave">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const ICONS = ['📱','💻','⌚','🎧','📷','🖥️','⌨️','🖱️','🎮','🏠','🚗','🔋','🖨️','🖲️','📺','🔊'];
let devices = [];
let editingId = null;
let selectedIcon = '📱';
let authToken = sessionStorage.getItem('auth_token') || '';

function authHeaders() {
  return authToken ? { 'Authorization': 'Bearer ' + authToken } : {};
}

async function api(method, path, body) {
  const opts = { method, headers: { ...authHeaders() } };
  if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  const res = await fetch(path, opts);
  if (res.status === 401) {
    authToken = prompt('请输入访问密码:') || '';
    sessionStorage.setItem('auth_token', authToken);
    return api(method, path, body);
  }
  if (!res.ok) throw new Error('API error: ' + res.status);
  return res.json();
}

async function load() {
  devices = await api('GET', '/api/devices');
  render();
}

function daysBetween(a, b) {
  const ms = new Date(b) - new Date(a);
  return Math.max(1, Math.round(ms / 86400000));
}
function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function calcDevice(d) {
  const end = d.retire_date || todayStr();
  const days = daysBetween(d.buy_date, end);
  const netCost = d.buy_price - (d.sell_price || 0);
  return { days, netCost, perDay: netCost / days };
}

function render() {
  const list = document.getElementById('deviceList');
  const empty = document.getElementById('emptyState');
  const loading = document.getElementById('loading');
  loading.style.display = 'none';

  const active = devices.filter(d => !d.retire_date);
  const retired = devices.filter(d => d.retire_date);

  if (devices.length === 0) {
    empty.style.display = 'block';
    list.style.display = 'none';
  } else {
    empty.style.display = 'none';
    list.style.display = 'flex';
    list.innerHTML = devices.map(d => {
      const c = calcDevice(d);
      const isActive = !d.retire_date;
      const priceLine = `买入 ¥${fmt(d.buy_price)}` +
        (isActive ? '' : ` · <span class="sell-price">卖出 ¥${fmt(d.sell_price || 0)}</span>`);
      return `<div class="device-card" data-id="${d.id}">
        <div class="device-icon">${d.icon}</div>
        <div class="device-info">
          <div class="device-name">${escapeHtml(d.name)}</div>
          <div class="device-meta">${priceLine}</div>
          <div class="device-buy-date">¥${fmt(c.perDay)}/天 · 购入 ${d.buy_date}</div>
        </div>
        <div class="device-right">
          <div class="device-days">${c.days}<small>天</small></div>
          <div class="device-status"><span class="dot ${isActive?'active':'retired'}"></span>${isActive?'使用中':'已退役'}</div>
        </div>
      </div>`;
    }).join('');
  }

  document.getElementById('headerActiveCount').textContent = active.length;
  document.getElementById('statActive').innerHTML = active.length + '<small>台</small>';
  document.getElementById('statRetired').innerHTML = retired.length + '<small>台</small>';
  document.getElementById('statDailyCost').textContent = '¥' + fmt(active.reduce((s,d) => s + calcDevice(d).perDay, 0));
  document.getElementById('statTotalBuy').textContent = '¥' + fmt(devices.reduce((s,d) => s + d.buy_price, 0));
  document.getElementById('statTotalSell').textContent = '¥' + fmt(retired.reduce((s,d) => s + (d.sell_price || 0), 0));

  list.querySelectorAll('.device-card').forEach(el => {
    el.addEventListener('click', () => openEdit(el.dataset.id));
  });
}

function fmt(n) { return (Math.round(n*100)/100).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

const modal = document.getElementById('editModal');
function openAdd() {
  editingId = null;
  document.getElementById('modalTitle').textContent = '添加设备';
  document.getElementById('fName').value = '';
  document.getElementById('fBuyPrice').value = '';
  document.getElementById('fBuyDate').value = todayStr();
  document.getElementById('fRetireDate').value = '';
  document.getElementById('fSellPrice').value = '0';
  document.getElementById('retireSection').style.display = 'none';
  document.getElementById('btnDelete').style.display = 'none';
  selectedIcon = '📱';
  renderIconPicker();
  modal.classList.add('show');
}
function openEdit(id) {
  const d = devices.find(x => x.id === id);
  if (!d) return;
  editingId = id;
  document.getElementById('modalTitle').textContent = '编辑设备';
  document.getElementById('fName').value = d.name;
  document.getElementById('fBuyPrice').value = d.buy_price;
  document.getElementById('fBuyDate').value = d.buy_date;
  document.getElementById('fRetireDate').value = d.retire_date || '';
  document.getElementById('fSellPrice').value = d.sell_price || 0;
  selectedIcon = d.icon;
  renderIconPicker();
  document.getElementById('retireSection').style.display = 'block';
  document.getElementById('btnDelete').style.display = 'block';
  modal.classList.add('show');
}
function closeModal() { modal.classList.remove('show'); }
function renderIconPicker() {
  document.getElementById('iconPicker').innerHTML = ICONS.map(ic =>
    `<div class="icon-option ${ic===selectedIcon?'selected':''}" data-ic="${ic}">${ic}</div>`
  ).join('');
  document.querySelectorAll('.icon-option').forEach(el => {
    el.addEventListener('click', () => { selectedIcon = el.dataset.ic; renderIconPicker(); });
  });
}

async function saveDevice() {
  const name = document.getElementById('fName').value.trim();
  const buyPrice = parseFloat(document.getElementById('fBuyPrice').value) || 0;
  const buyDate = document.getElementById('fBuyDate').value;
  const retireDate = document.getElementById('fRetireDate').value || null;
  const sellPrice = parseFloat(document.getElementById('fSellPrice').value) || 0;
  if (!name) { toast('请输入设备名称'); return; }
  if (!buyDate) { toast('请选择买入日期'); return; }
  if (buyPrice <= 0) { toast('请输入买入价格'); return; }

  const payload = { name, icon: selectedIcon, buyPrice, buyDate, retireDate, sellPrice };
  try {
    if (editingId) {
      await api('PUT', '/api/devices/' + editingId, payload);
    } else {
      await api('POST', '/api/devices', payload);
    }
    toast('已保存');
    closeModal();
    await load();
  } catch(e) { toast('保存失败: ' + e.message); }
}

async function deleteDevice() {
  if (!editingId) return;
  if (!confirm('确定删除这台设备？')) return;
  try {
    await api('DELETE', '/api/devices/' + editingId);
    toast('已删除');
    closeModal();
    await load();
  } catch(e) { toast('删除失败: ' + e.message); }
}

let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

document.getElementById('fabBtn').addEventListener('click', openAdd);
document.getElementById('btnCancel').addEventListener('click', closeModal);
document.getElementById('btnSave').addEventListener('click', saveDevice);
document.getElementById('btnDelete').addEventListener('click', deleteDevice);
modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });

load().catch(e => toast('加载失败: ' + e.message));
</script>
</body>
</html>
